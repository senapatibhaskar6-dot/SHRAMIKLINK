<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>ShramikLinks</title>
    
    <!-- App Description & Theme -->
    <meta name="description" content="Manufacturing industry and labor contractor compliance and management platform." />
    <meta name="theme-color" content="#0284c7" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShramikLinks" />

    <!-- Web App Manifest Link -->
    <link rel="manifest" href="/manifest.json" />

    <!-- App Icon Links -->
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <meta property="og:title" content="ShramikLinks" />
    <meta property="og:description" content="Manufacturing industry and labor contractor compliance and management platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Handle Service Worker & caching
      if ('serviceWorker' in navigator) {
        if (window.self !== window.top) {
          // Inside preview iframe (AI Studio): Unregister SW and purge old cache so live preview updates immediately
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const reg of registrations) {
              reg.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const key of keys) {
                caches.delete(key);
              }
            });
          }
        } else {
          // Standalone app / direct tab: Register Service Worker with auto-update
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => {
                console.log('ShramikLinks Service Worker registered:', reg.scope);
                reg.update();
              })
              .catch((err) => {
                console.error('ShramikLinks Service Worker registration failed:', err);
              });
          });
        }
      }
    </script>
  </body>
</html>
